    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 20px;

    button {
      width: 200px;
      height: 40px;
      display: block;
      margin: 20px auto;
      border: 0;
      outline: none;
      border-radius: 0;
      padding: 10px 0;
      font-size: 16px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      background: #1ab188;
      color: #ffffff;
      transition: all 0.5s ease;
    }
  }

  .content {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    display: none;

  .content .checkout-container{
      width: 100%;
      height: 100%;
    }
</style>
